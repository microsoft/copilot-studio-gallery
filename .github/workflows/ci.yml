name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - name: Detect submission source changes
        id: submission-changes
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --no-renames "$PR_BASE_SHA...HEAD" -- submissions/)
          if grep -Eq '^submissions/[a-z0-9]+(-[a-z0-9]+)*/' <<< "$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run importer tests
        run: npm test
      - name: Import submissions
        run: npm run import:submissions
      - name: Commit generated content
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.submission-changes.outputs.changed == 'true'
        run: |
          if [ -n "$(git status --porcelain src/content/solutions src/content/guides public/bundles)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/solutions src/content/guides public/bundles
            git commit -m "chore: import solution submissions"
            git push
          else
            echo "Generated content is current."
          fi
      - name: Type check
        run: npm run check
      - name: Build site
        run: npm run build

  app-setup-windows:
    name: Verify PowerShell app installer on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify setup command sequencing and failure handling
        run: node --import tsx --test scripts/managed-app-install.test.ts scripts/managed-app-data.test.ts
